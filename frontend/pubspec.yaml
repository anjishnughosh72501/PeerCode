name: codeshare
description: LAN collaborative code editor.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  web_socket_channel: ^3.0.3
  http: ^1.2.2
  file_picker: ^8.1.2
  google_fonts: ^6.2.1
  flutter_highlight: ^0.7.0
  re_editor: ^0.3.0
  go_router: ^14.2.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.12

flutter:
  uses-material-design: true
